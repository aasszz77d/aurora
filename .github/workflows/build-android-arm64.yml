name: Build Android arm64

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build arm64 release APK
        run: |
          flutter build apk --release --target-platform android-arm64
          find build/app/outputs -name "*.apk" -type f -print

      - name: Collect artifact
        run: |
          mkdir -p dist
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/aurora-arm64-v8a-release.apk
          elif [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/aurora-arm64-v8a-release.apk
          else
            apk=$(find build/app/outputs -name "*.apk" -type f | head -n1)
            if [ -z "$apk" ]; then
              echo "No APK found" >&2
              exit 1
            fi
            cp "$apk" dist/aurora-arm64-v8a-release.apk
          fi
          ls -lh dist/
          file dist/aurora-arm64-v8a-release.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-arm64-v8a-release
          path: dist/aurora-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aurora-arm64-v8a-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
