allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// file_picker / flutter_plugin_android_lifecycle need API 36+;
// force plugin modules that still declare compileSdk 34.
subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.plugins.hasPlugin("com.android.library") ||
            subproject.plugins.hasPlugin("com.android.application")) {
            subproject.android {
                if (compileSdkVersion instanceof Integer && compileSdkVersion < 36) {
                    compileSdk 36
                }
                if (compileSdk instanceof Integer && compileSdk < 36) {
                    compileSdk = 36
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
